<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Digital Toolkit Store</title>
<style>body{font-family:system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;line-height:1.6}.card{border:1px solid #ddd;border-radius:16px;padding:24px}.price{font-size:2rem;font-weight:700}a.button{display:inline-block;padding:12px 18px;border-radius:10px;background:#111;color:#fff;text-decoration:none}small{color:#666}</style></head>
<body><h1>Digital Toolkit Store</h1><div class='card'><h2 id='title'>Loading...</h2><p id='problem'></p><p class='price' id='price'></p><p id='target'></p><a class='button' id='buy' href='#'>Buy</a><p><small>Generated by Autonomous Income Engine.</small></p></div>
<script>fetch('./latest.json').then(r=>r.json()).then(p=>{document.querySelector('#title').textContent=p.title||'Digital Toolkit';document.querySelector('#problem').textContent=p.sales_angle||p.problem||'';document.querySelector('#price').textContent='$'+(p.price_usd||0);document.querySelector('#target').textContent='For: '+(p.target_customer||'');document.querySelector('#buy').href=p.payhip_url||'#';});</script>
</body></html>
