name: Autonomous Income Engine

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "İstersen üretilecek ürünün konusunu yaz. Boş bırakırsan sistem kendi fırsatını araştırır."
        required: false
        type: string
        default: ""
  schedule:
    - cron: '17 3 * * 1,4'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q src
      - name: Run engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_TOPIC: ${{ inputs.topic }}
        run: PYTHONPATH=src python -m income_engine.pipeline
      - name: Upload product pack
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-product-${{ github.run_number }}
          path: dist/
          retention-days: 7
      - name: Commit state and storefront data
        run: |
          git config user.name 'autonomous-income-engine'
          git config user.email 'actions@users.noreply.github.com'
          git add state/ site/latest.json
          git diff --cached --quiet || git commit -m 'chore: update opportunity state'
          git push
